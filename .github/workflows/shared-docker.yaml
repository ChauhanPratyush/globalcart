name: Shared Docker Build and Publish

on:
  workflow_call:
    inputs:
      image_name:
        description: Image name without registry, e.g. owner/globalcart
        required: true
        type: string
    secrets:
      CR_PAT:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute dynamic tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          IMAGE_NAME_LOWER=$(echo "${{ inputs.image_name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="ghcr.io/${IMAGE_NAME_LOWER}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_name_lower=${IMAGE_NAME_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}
            ghcr.io/${{ steps.meta.outputs.image_name_lower }}:latest
